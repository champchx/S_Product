<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบจัดการผลิตข้าว</title>
<meta name="theme-color" content="#00A8D0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BSCM ผลิตข้าว">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap">
<style>
/* Layout: ศูนย์ควบคุมแบบเรียบ — แถบหัว + แท็บสองหน้า (ใบสั่งผลิต / ชนิดข้าวและสูตร), รายการเป็นแถวกว้างเต็มคอลัมน์เดียว, ฟอร์มเปิดเป็นแผ่นซ้อน */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface2:#E9EEE8; --line:#D5DDD3;
  --fg:#1B2620; --muted:#5D6B62;
  --accent:#2E6B4F; --accent-fg:#FFFFFF; --accent-soft:#DCEBE2;
  --warn:#8F5E0E; --warn-soft:#F6E7C8;
  --danger:#B23A32; --danger-soft:#F7DDDA; --info:#2F6DA8; --info-soft:#DDE9F5;
  --c0:#2F8F6B; --c1:#D49A2A; --c2:#3B7DB5; --c3:#B65A8A; --c4:#7A8F3A; --c5:#C26A4A;
  --font-body:'Noto Sans Thai',system-ui,sans-serif;
  --font-head:'Prompt','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1A221E; --surface2:#222C27; --line:#2F3B35;
  --fg:#E6EDE8; --muted:#9AA99F;
  --accent:#5FB88B; --accent-fg:#0E1A13; --accent-soft:#21382D;
  --warn:#E0B15A; --warn-soft:#3A2F16;
  --danger:#EF8077; --danger-soft:#3C1F1D; --info:#7DB4E8; --info-soft:#1F3347; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1A221E; --surface2:#222C27; --line:#2F3B35;
  --fg:#E6EDE8; --muted:#9AA99F;
  --accent:#5FB88B; --accent-fg:#0E1A13; --accent-soft:#21382D;
  --warn:#E0B15A; --warn-soft:#3A2F16;
  --danger:#EF8077; --danger-soft:#3C1F1D; --info:#7DB4E8; --info-soft:#1F3347; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:22px}
h2{font-size:18px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{display:block;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.notice{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:13px}
.summary{display:flex;gap:28px;flex-wrap:wrap;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.summary div{display:flex;flex-direction:column}
.summary b{font-family:var(--font-head);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.summary span{color:var(--muted);font-size:13px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:60px}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.row>*{min-width:0}
.no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.name{font-family:var(--font-head);font-weight:600;font-size:17px}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.meta b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.running{background:var(--accent-soft);color:var(--accent)}
.pill.paused{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--surface2);color:var(--muted)}
.line.bpl{grid-template-columns:minmax(0,1fr) 120px 76px}
.bpr{padding:6px 0;border-bottom:1px dashed var(--line)}
.bpr:last-child{border-bottom:0}
.jb{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:8px}
.jb label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.jb .hint{grid-column:1/-1}
.bpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.bpgrid label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
@media (max-width:480px){.bpgrid{grid-template-columns:1fr}}
.actions{display:flex;gap:6px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 24px;padding-top:10px}
.detail h3{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border-bottom:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--surface2);padding:2px 10px;border-radius:6px;font-size:13px;font-variant-numeric:tabular-nums}

.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.bar span{display:block;height:100%;min-width:2px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}

.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px;align-items:center}

.scrim{position:fixed;inset:0;background:rgba(10,18,14,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:600px;margin:auto;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr 96px 36px;gap:8px;align-items:center}
.line.bp{grid-template-columns:1fr 110px 36px}
.x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;border-radius:6px;height:36px}
.x:hover{color:var(--danger)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .txt{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.meter .ok{color:var(--accent);font-weight:600}
.meter .bad{color:var(--danger);font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.role{padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.code{display:inline-block;padding:0 8px;border-radius:5px;background:var(--surface2);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.orow{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.orow:hover{border-color:var(--accent)}
.orow .pill{min-width:84px;text-align:center}
.orow .om{display:flex;flex-direction:column;min-width:0}
.orow .om b{font-weight:600;overflow-wrap:anywhere}
.orow .ot{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.orow .chev{color:var(--muted);font-size:20px}
@media (max-width:560px){.orow{grid-template-columns:auto 1fr auto}.orow .ot{grid-column:1/-1;text-align:left}}
.sheet .detail{grid-template-columns:1fr}
.ck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;background:var(--surface)}
.ck input{width:auto}
.ck:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.tw{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap}
.tbl th,.tbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td:first-child{min-width:140px}
.tbl tfoot td{font-weight:600;border-bottom:0}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--surface2)}
.dsec{display:flex;flex-direction:column;gap:8px}
.dsec>h2{font-size:16px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 20px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kpis div{display:flex;flex-direction:column;min-width:0}
.kpis b{font-family:var(--font-head);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpis span{color:var(--muted);font-size:13px}
.kpis small{color:var(--muted);font-size:12px}
.chart{display:flex;gap:4px;align-items:flex-end;height:170px;min-width:100%}
.chart .col{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .bars{display:flex;gap:2px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.chart .bars i{display:block;width:40%;max-width:22px;border-radius:3px 3px 0 0;min-height:0}
.chart .lb{font-size:11px;color:var(--muted);height:14px;white-space:nowrap}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.line.wr{grid-template-columns:minmax(0,1fr) 92px 104px 36px}
.line.fr{grid-template-columns:minmax(0,1fr) 170px 84px 36px}
@media (max-width:480px){.line.wr,.line.fr{grid-template-columns:1fr 1fr 36px}.line.wr>input:first-child,.line.fr>input:first-child{grid-column:1/-1}}
.pill.open{background:var(--info-soft);color:var(--info)}
.orow>.btn{justify-self:end}
div.orow{cursor:pointer}
@media (max-width:560px){.orow>.btn,.orow>.chev{grid-column:3;grid-row:1}}
.orow.prow{grid-template-columns:34px auto 1fr auto auto}
.seq{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--surface2);color:var(--muted);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.seq.next{background:var(--accent);color:var(--accent-fg)}
.pa{display:flex;gap:6px;align-items:center;justify-content:flex-end}
@media (max-width:560px){
  .orow.prow{grid-template-columns:34px 1fr auto}
  .prow>.seq{grid-column:1;grid-row:1}.prow>.om{grid-column:2;grid-row:1}.prow>.pill{grid-column:3;grid-row:1}
  .prow>.ot{grid-column:2/-1;grid-row:2;text-align:left}.prow>.pa{grid-column:1/-1;grid-row:3;justify-self:end}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>
<style>.brandrow{display:flex;align-items:center;gap:10px}.logo{height:34px;width:auto;background:#00A8D0;padding:7px 10px;border-radius:9px;flex:none}.logo.big{height:46px;margin-bottom:12px}@media(max-width:480px){.brandrow{gap:8px}.brandrow .logo{height:26px;padding:5px 7px}.brandrow h1{font-size:16px;white-space:nowrap}.brandrow small{font-size:11px;white-space:nowrap}}
/* ===== มือถือ / แอป ===== */
html{-webkit-text-size-adjust:100%}
button,.chip,.tab,.orow{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#installbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:520px;margin:0 auto}
#installbar span{flex:1;font-size:14px}
@media (max-width:720px){
  body{padding-block:12px calc(76px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));font-size:16px}
  .wrap{gap:14px}
  h1{font-size:19px}
  /* แถบเมนูล่าง */
  header>.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;border-radius:0;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);justify-content:space-around}
  header>.tabs .tab{flex:1;min-height:52px;padding:6px 2px;font-size:12.5px;line-height:1.25;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center}
  header>.tabs .tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:none;font-weight:600}
  header{flex-wrap:nowrap;align-items:flex-start}
  .brand{min-width:0}
  .who{justify-content:flex-end;text-align:right;max-width:46%}
  /* ปุ่มและช่องกรอกใหญ่ขึ้น กดง่าย และกัน iOS ซูมเองตอนพิมพ์ */
  .btn{min-height:44px;padding:10px 16px}
  input,select,textarea{font-size:16px;min-height:44px;padding:10px 12px}
  textarea{min-height:88px}
  input[type=checkbox],input[type=radio]{min-height:0;width:22px;height:22px}
  .chip{padding:9px 14px;font-size:14px}
  .toolbar{gap:8px}
  .toolbar .btn.primary{flex:1 1 100%}
  .toolbar select{width:100%!important}
  .toolbar .grow{flex:1 1 100%}
  .foot{position:sticky;bottom:0;background:var(--surface);padding-top:10px;margin-top:6px;flex-wrap:nowrap}
  .foot .btn{flex:1;white-space:normal}
  /* หน้าต่างกรอกข้อมูล: เลื่อนขึ้นจากด้านล่างเต็มความกว้าง */
  .scrim{padding:0;align-items:flex-end}
  .sheet{max-width:none;margin:0;border-radius:18px 18px 0 0;max-height:94dvh;overflow-y:auto;padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px));border-bottom:0;-webkit-overflow-scrolling:touch}
  #login.scrim{align-items:center;padding:16px}
  #login .sheet{border-radius:16px;max-height:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  #installbar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .recipes{grid-template-columns:1fr}
}
@media (display-mode:standalone){body{padding-top:max(12px,env(safe-area-inset-top,0px))}}
@media print{header>.tabs,#installbar{display:none!important}body{padding-bottom:0}}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>
  <header>
    <div class="brand brandrow"><img class="logo" src="logo-white.png" alt="BSCM"><div><h1>ระบบจัดการผลิตข้าว</h1><small>BSCM DEMO By Champ</small></div></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-plans" data-act="tab" data-tab="plans">แผนการผลิต</button>
      <button class="tab" role="tab" id="tab-orders" data-act="tab" data-tab="orders">รายการผลิต</button>
      <button class="tab" role="tab" id="tab-dash" data-act="tab" data-tab="dash">แดชบอร์ด</button>
      <button class="tab" role="tab" id="tab-recipes" data-act="tab" data-tab="recipes">ชนิดข้าว / สูตร</button>
    </div>
    <div id="who" class="who"></div>
  </header>
  <div id="notice" class="notice" hidden></div>

  <section id="plans-view" class="wrap" style="gap:14px" hidden>
    <div id="psummary" class="summary"></div>
    <div class="toolbar">
      <div class="chips">
        <button class="chip" data-pfilter="all">ทั้งหมด</button>
        <button class="chip" data-pfilter="open">รอเริ่มผลิต</button>
        <button class="chip" data-pfilter="started">เริ่มผลิตแล้ว</button>
      </div>
      <select id="ptype" aria-label="กรองตามชนิดข้าว" style="width:auto;max-width:100%"></select>
      <input id="pq" class="grow" type="search" placeholder="ค้นหาเลขที่ หรือรหัสสูตร">
      <button class="btn primary" id="pnewbtn" data-act="new-plan">+ ออกใบสั่งผลิต</button>
    </div>
    <div id="plist" class="list"></div>
  </section>

  <section id="orders-view" class="wrap" style="gap:14px">
    <div id="summary" class="summary"></div>
    <div class="toolbar">
      <div class="chips" id="chips">
        <button class="chip" data-filter="all">ทั้งหมด</button>
        <button class="chip" data-filter="running">กำลังผลิต</button>
        <button class="chip" data-filter="paused">หยุดชั่วคราว</button>
        <button class="chip" data-filter="done">ผลิตเสร็จ</button>
      </div>
      <select id="ftype" aria-label="กรองตามชนิดข้าว" style="width:auto;max-width:100%"></select>
      <input id="q" class="grow" type="search" placeholder="ค้นหาเลขที่ หรือรหัสสูตร">

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const pctOf=(a,t)=>t>0?fmt((+a||0)/t*100)+'%':'-';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const dt=s=>s?new Date(s).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'-';
const dd=s=>s?new Date(s+'T00:00').toLocaleDateString('th-TH',{dateStyle:'medium'}):'-';
const nowLocal=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const dur=(a,b)=>{const m=Math.round((new Date(b)-new Date(a))/60000);if(!(m>=0))return '-';const h=Math.floor(m/60);return (h?h+' ชม. ':'')+(m%60)+' นาที'};

const BP=['ปลายเบอร์ 1','ปลายเบอร์ 2','ปลายเบอร์ 3','ปลายเบอร์ 4','ข้าวดีดเบอร์ 2','ข้าวดีดเบอร์ 3','รำ'];
const LABEL={open:'รอเริ่มผลิต',running:'กำลังผลิต',paused:'หยุดชั่วคราว',done:'ผลิตเสร็จ'};
const st=o=>o.status==='done'?'done':o.status==='paused'?'paused':'running';
const mins=(a,b)=>Math.max(0,Math.round((new Date(b)-new Date(a))/60000));
const hm=m=>{const h=Math.floor(m/60);return (h?h+' ชม. ':'')+(m%60)+' นาที'};
const lossStr=m=>m?`${hm(m)} (${fmt(Math.round(m/60*100)/100)} ชม.)`:'0 ชม.';
function lossMin(o){const end=o.status==='done'?o.endAt:nowLocal();return (o.pauses||[]).reduce((a,p)=>a+mins(p.from,p.to||end),0)}
function upd(o,patch,drop){const d={...o,...patch};delete d.id;(drop||[]).forEach(k=>delete d[k]);return put('orders',o.id,d)}
const isAdmin=()=>S.role==='admin';
const JUMBO_FULL={'รำ':703},JUMBO_DEFAULT=1203,JUMBO_TARE=3; // น้ำหนักเต็ม 1 จัมโบ้ (กก.) แยกตามผลพลอยได้ และน้ำหนักหักต่อใบ เศษนับเป็น 1 ใบ
const jumboKg=name=>JUMBO_FULL[name]||JUMBO_DEFAULT;
const jumboBags=(n,r)=>n+(r>0?1:0);
const jumboNet=(n,r,name)=>jumboKg(name)*n+r-JUMBO_TARE*jumboBags(n,r);
const IN_TANKS=['AA02','AA03','AA08','A1A1'];
const OUT_TANKS=['AB01','AB02','AB03','AB04','A1A1'];
const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const MONL=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const DOW=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const tn=kg=>Number((kg||0)/1000).toLocaleString('th-TH',{maximumFractionDigits:3});
const inputsOf=o=>(o.inputs||[]).map(x=>({name:x.name||'',tank:x.tank||'',kg:x.kg}));
const tankTags=a=>(a||[]).length?a.map(k=>`<span class="code">${esc(k)}</span>`).join(' '):'—';
const inTanksOf=o=>o.inTanks&&o.inTanks.length?o.inTanks:[...new Set(inputsOf(o).map(r=>r.tank).filter(Boolean))];
function mx(o){
  const done=st(o)==='done',total=done&&o.startAt?mins(o.startAt,o.endAt):0,loss=lossMin(o),net=Math.max(0,total-loss);
  const inKg=(o.inputs||[]).reduce((a,x)=>a+(+x.kg||0),0),byKg=(o.byproducts||[]).reduce((a,x)=>a+(+x.kg||0),0),hasIn=inKg>0;
  return{done,total,loss,net,inKg,byKg,hasIn,outKg:done&&hasIn?inKg-byKg:null,rate:done&&hasIn&&net>0?(inKg/1000)/(net/60):null};
}
const dts=s=>s?new Date(s).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rice:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'rice:'+t)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h}}
const codeOf=o=>o.code||((S.types.find(t=>t.id===o.typeId)||{}).code)||'';
const S={dash:{kind:'day',ref:Date.now(),type:'',status:'all',q:''},role:null,typeFilter:'',adminHash:null,plans:[],pf:'all',ptype:'',pq:'',types:[],orders:[],filter:'all',q:'',tab:'plans'};
const API_URL='https://script.google.com/macros/s/AKfycbxyyP1SutUjAhqpTx1DXflB5XXoNuDecPbFq7wk_68YneJz_of-Mjt_rpUEBSqdHlq8/exec';
const SHEET=/^https:\/\/script\.google\.com\//.test(API_URL);
let pending=0,wv=0;
const LS='rice-production-v1';

/* ---------- storage: Google Sheets (via Apps Script) ---------- */
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||'{}');S.types=j.types||[];S.orders=j.orders||[];S.plans=j.plans||[]}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({types:S.types,orders:S.orders,plans:S.plans}))}catch(e){}}
const KEY={riceTypes:'types',orders:'orders',plans:'plans'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function localPut(coll,id,data){const arr=S[KEY[coll]];const rec={...data,id};const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=rec;else arr.push(rec)}
function safeRender(){try{render()}catch(e){console.error(e)}}
function fail(msg,e){console.error(e);toast(msg+(e&&e.message?': '+String(e.message).slice(0,140):''),7000)}
let chain=Promise.resolve();
function api(body){const r=chain.then(()=>apiRaw(body));chain=r.catch(()=>{});return r} // ส่งทีละคำสั่งตามลำดับ ไม่ชนกัน
async function apiRaw(body){
  let last;
  for(let k=0;k<3;k++){
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({by:(typeof S!=='undefined'&&S.role==='admin')?'ธุรการ':(typeof S!=='undefined'&&S.role?'พนักงาน':'')},body))});
      const t=await r.text();let j;
      try{j=JSON.parse(t)}catch(e){throw new Error('ลิงก์ Web App ตอบกลับไม่ถูกต้อง (ตรวจว่าตั้งค่า Who has access เป็น Anyone และ Deploy เวอร์ชันล่าสุดแล้ว)')}
      if(!j.ok)throw new Error(j.error||'api error');
      return j;
    }catch(e){
      last=e instanceof TypeError?new Error('เชื่อมต่อ Google ไม่ได้ชั่วคราว (เครือข่ายหรือเซิร์ฟเวอร์ตอบช้า) กรุณากดบันทึกอีกครั้ง'):e;
      if(k<2)await sleep(k?2500:900);
    }
  }
  throw last;
}
async function pull(){
  const v0=wv;
  const r=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'t='+Date.now());
  const j=await r.json();if(!j.ok)throw new Error(j.error||'api error');
  if(pending>0||wv!==v0)return; // มีการบันทึกระหว่างโหลด ข้อมูลที่ได้มาอาจเก่ากว่า จึงไม่นำมาทับ
  S.types=j.riceTypes||[];S.orders=j.orders||[];S.plans=j.plans||[];
  const a=(j.settings||[]).find(x=>x.id==='admin');S.adminHash=a?a.hash:null;
  S.loaded=true;notice('');safeRender();
}
async function putMany(ops){
  try{
    ops.forEach(([c,i,d])=>localPut(c,i,d));wv++;safeRender();
    if(!SHEET){lsSave();return true}
    pending++;
    try{
      try{if(ops.length===1){const [coll,id,data]=ops[0];await api({action:'set',coll,id,data})}else await api({action:'batch',ops:ops.map(([coll,id,data])=>({action:'set',coll,id,data}))})}
      catch(e){
        // Code.gs เวอร์ชันเก่ายังไม่รองรับ batch ให้บันทึกทีละรายการแทน
        if(ops.length>1&&/bad collection|bad action|missing id/.test(e.message)){for(const [coll,id,data] of ops)await api({action:'set',coll,id,data})}
        else throw e;
      }
    }finally{pending--;wv++}
    return true;
  }catch(e){fail('บันทึกไม่สำเร็จ',e);if(SHEET)pull().catch(()=>{});return false}
}
const put=(coll,id,data)=>putMany([[coll,id,data]]);
async function del(coll,id){
  try{
    S[KEY[coll]]=S[KEY[coll]].filter(x=>x.id!==id);wv++;safeRender();
    if(SHEET){pending++;try{await api({action:'delete',coll,id})}finally{pending--;wv++}}else lsSave();
    return true;
  }catch(e){fail('ลบไม่สำเร็จ',e);if(SHEET)pull().catch(()=>{});return false}
}
async function saveAdminHash(h){
  S.adminHash=h;
  if(SHEET){await api({action:'set',coll:'settings',id:'admin',data:{hash:h}})}
  else{try{localStorage.setItem(LS+'-admin',h)}catch(e){}}
}
async function init(){
  try{S.role=sessionStorage.getItem('rice-role')||null}catch(e){}
  if(SHEET){
    render();notice('กำลังโหลดข้อมูลจาก Google Sheets…');
    try{await pull()}catch(e){notice('เชื่อมต่อ Google Sheets ไม่ได้ กรุณาตรวจสอบลิงก์ API_URL และการตั้งค่าแชร์ของ Web App')}
    setInterval(()=>{if(!document.hidden&&$('#modal').hidden&&!pending)pull().catch(()=>{})},30000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#modal').hidden)pull().catch(()=>{})});
    return;
  }
  try{S.adminHash=localStorage.getItem(LS+'-admin')||null}catch(e){}
  lsLoad();render();
  notice('ยังไม่ได้ตั้งค่า API_URL ข้อมูลจะเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น');
}

/* ---------- helpers ---------- */
function toast(m,ms){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms||2800)}
function notice(m){const n=$('#notice');n.textContent=m;n.hidden=!m}
function bar(f){return '<div class="bar">'+(f||[]).map((x,i)=>`<span style="flex:${x.pct};background:var(--c${i%6})" title="${esc(x.name)} ${fmt(x.pct)}%"></span>`).join('')+'</div>'}
function orderNo(){const p='SP-B026-';let max=0;S.orders.concat(S.plans).forEach(o=>{if((o.no||'').startsWith(p))max=Math.max(max,parseInt(o.no.slice(p.length))||0)});return p+String(max+1).padStart(3,'0')}
function openModal(html,mount){$('#sheet').innerHTML=html;$('#modal').hidden=false;document.body.style.overflow='hidden';if(mount)mount();const f=$('#sheet input:not([readonly]),#sheet select');if(f&&!f.value)f.focus()}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow=''}
function ingDatalist(){const s=new Set();S.types.forEach(t=>(t.formula||[]).forEach(x=>s.add(x.name)));$('#dl-ing').innerHTML=[...s].map(v=>`<option value="${esc(v)}">`).join('')}

/* ---------- login ---------- */
function showLogin(){
  const L=$('#login');
  L.innerHTML=`<div class="sheet" style="max-width:420px"><div><img class="logo big" src="logo-white.png" alt="BSCM"><h2>ระบบจัดการผลิตข้าว</h2><div class="hint">เลือกผู้ใช้งาน</div></div>
  <button class="btn primary" style="padding:14px" data-act="login-staff">เข้าใช้งานในฐานะพนักงาน</button>
  <div class="field"><label for="l-pw">ธุรการ ใส่รหัสผ่าน</label><input id="l-pw" type="password" autocomplete="off"></div>
  <button class="btn" data-act="login-admin" style="padding:12px">เข้าใช้งานในฐานะธุรการ</button></div>`;
  L.hidden=false;
  $('#l-pw').addEventListener('keydown',e=>{if(e.key==='Enter')loginAdmin()});
}
function setRole(r){S.role=r;try{r?sessionStorage.setItem('rice-role',r):sessionStorage.removeItem('rice-role')}catch(e){}
  if(r){$('#login').hidden=true;$('#login').innerHTML=''}render()}
async function loginAdmin(){
  const v=$('#l-pw').value;if(!v)return toast('ใส่รหัสผ่านธุรการ');
  if(SHEET&&!S.loaded){try{await pull()}catch(e){return toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้')}}
  const h=await sha(v),want=S.adminHash||await sha('1234');
  if(h!==want){toast('รหัสผ่านไม่ถูกต้อง');$('#l-pw').value='';return}
  setRole('admin');
}
function pwForm(){
  openModal(`<h2>เปลี่ยนรหัสผ่านธุรการ</h2>
  <div class="field"><label for="w1">รหัสผ่านใหม่</label><input id="w1" type="password" autocomplete="off"></div>
  <div class="field"><label for="w2">ยืนยันรหัสผ่านใหม่</label><input id="w2" type="password" autocomplete="off"></div>
  <div class="foot"><button class="btn" data-act="close">ยกเลิก</button><button class="btn primary" id="w-save">บันทึกรหัสผ่าน</button></div>`,()=>{
    $('#w-save').onclick=async()=>{
      const a=$('#w1').value,b=$('#w2').value;
      if(a.length<4)return toast('รหัสผ่านต้องมีอย่างน้อย 4 ตัวอักษร');
      if(a!==b)return toast('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
      try{await saveAdminHash(await sha(a));closeModal();toast('เปลี่ยนรหัสผ่านแล้ว')}catch(e){toast('บันทึกรหัสผ่านไม่สำเร็จ')}
    };
  });
}
function renderWho(){
  $('#who').innerHTML=S.role?`<span class="role">${isAdmin()?'ธุรการ':'พนักงาน'}</span>${isAdmin()?'<button class="btn sm" data-act="pw">เปลี่ยนรหัสผ่าน</button>':''}<button class="btn sm" data-act="logout">ออกจากระบบ</button>`:'';
}

/* ---------- render ---------- */

function render(){
  renderWho();
  if(!S.role){$('#app').hidden=true;if($('#login').hidden)showLogin();return}
  $('#app').hidden=false;
  if(!isAdmin()&&S.tab==='recipes')S.tab='orders';
  $('#tab-recipes').hidden=!isAdmin();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
  $('#plans-view').hidden=S.tab!=='plans';$('#orders-view').hidden=S.tab!=='orders';$('#recipes-view').hidden=S.tab!=='recipes';$('#dash-view').hidden=S.tab!=='dash';
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.pfilter?c.dataset.pfilter===S.pf:c.dataset.filter===S.filter));
  ingDatalist();renderSummary();renderOrders();renderPlans();renderTypes();if(S.tab==='dash')renderDash();
}
function renderSummary(){
  const c={running:0,paused:0,done:0};let loss=0;
  S.orders.forEach(o=>{c[st(o)]++;loss+=lossMin(o)});
  $('#summary').innerHTML=`<div><b>${c.running}</b><span>กำลังผลิต</span></div><div><b>${c.paused}</b><span>หยุดชั่วคราว</span></div>
  <div><b>${c.done}</b><span>ผลิตเสร็จ</span></div><div><b>${fmt(loss/60)}</b><span>เวลาสูญเสียรวม (ชม.)</span></div>`;
}
function orderRow(o){
  const s=st(o),code=codeOf(o),loss=lossMin(o);
  return `<button class="orow" data-act="open" data-id="${o.id}">
    <span class="pill ${s}">${LABEL[s]}</span>
    <span class="om"><b>${esc(o.typeName)} ${code?`<span class="code">${esc(code)}</span>`:''}</b><span class="no">${esc(o.no)}</span></span>
    <span class="ot">${fmt(o.qty)} กก. · เริ่ม ${dts(o.startAt)}${loss?` · สูญเสีย ${fmt(Math.round(loss/60*100)/100)} ชม.`:''}</span>
    <span class="chev" aria-hidden="true">›</span></button>`;
}
function orderDetail(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const s=st(o),done=s==='done',paused=s==='paused',code=codeOf(o),pauses=o.pauses||[];
  const ing=(o.formula||[]).map((x,i)=>`<div class="kv"><span><i class="sw" style="background:var(--c${i%6})"></i>${esc(x.name)} ${fmt(x.pct)}%</span><b>${fmt(o.qty*x.pct/100)} กก.</b></div>`).join('');
  const loss=lossMin(o),endRef=done?o.endAt:nowLocal();
  const total=o.startAt?mins(o.startAt,endRef):0;
  const open=pauses.find(p=>!p.to);
  const pl=pauses.map((p,i)=>`<div class="kv"><span>${esc(p.reason||'ไม่ระบุเหตุผล')}<br><span class="hint">${dt(p.from)} – ${p.to?dt(p.to):'ยังหยุดอยู่'}</span></span><span><b>${hm(mins(p.from,p.to||endRef))}</b>${isAdmin()?` <button class="x" style="height:24px;font-size:15px" data-act="del-pause" data-id="${o.id}" data-i="${i}" aria-label="ลบรายการหยุด">×</button>`:''}</span></div>`).join('');
  const bp=o.byproducts||[];
  const m=mx(o);

    </div>
    ${acts.length?`<div class="foot" style="justify-content:flex-start">${acts.join('')}</div>`:''}`);
}

  </div>
  <div class="field"><label for="f-type">ชนิดข้าว</label><select id="f-type" ${pl?'disabled':''}>${S.types.map(t=>`<option value="${t.id}" ${src&&src.typeId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
  <div class="grid2">
    <div class="field"><label for="f-qty">จำนวนที่ผลิต (กก.)</label><input id="f-qty" type="number" min="1" step="any" inputmode="decimal" value="${src?src.qty:''}" ${pl?'readonly':''} placeholder="เช่น 1000"></div>

  </div>
  <div id="f-prev"></div>
  <div class="field"><span class="lbl">ถัง input</span><div class="tags">${IN_TANKS.map(k=>`<label class="ck"><input type="checkbox" data-intank="${k}" ${o&&inTanksOf(o).includes(k)?'checked':''}>${k}</label>`).join('')}</div></div>
  <div class="field"><span class="lbl">ถังเก็บข้าวที่ผลิตได้</span><div class="tags">${OUT_TANKS.map(k=>`<label class="ck"><input type="checkbox" data-out="${k}" ${o&&(o.outTanks||[]).includes(k)?'checked':''}>${k}</label>`).join('')}</div></div>
  <div class="field"><label for="f-note">หมายเหตุ</label><textarea id="f-note">${esc(o?o.note:(pl?pl.note:''))}</textarea></div>

    const prev=()=>{
      const t=S.types.find(x=>x.id===$('#f-type').value),q=parseFloat($('#f-qty').value)||0;
      $('#f-prev').innerHTML=t?`<div class="lbl" style="margin-bottom:6px">สูตรผสม${q?' ที่ต้องใช้':''}</div>${bar(t.formula)}<div style="margin-top:6px">`+t.formula.map((x,i)=>`<div class="kv"><span><i class="sw" style="background:var(--c${i%6})"></i>${esc(x.name)} ${fmt(x.pct)}%</span><b>${q?fmt(q*x.pct/100)+' กก.':''}</b></div>`).join('')+'</div>':'';
    };
    $('#f-type').oninput=prev;$('#f-qty').oninput=prev;prev();
    $('#f-save').onclick=async()=>{
      const t=S.types.find(x=>x.id===$('#f-type').value),qty=parseFloat($('#f-qty').value),no=$('#f-no').value.trim(),startAt=$('#f-start').value;
      if(!no)return toast('กรอกเลขที่ใบสั่ง');
      if(!startAt)return toast('ใส่เวลาเริ่มผลิต');
      if(!(qty>0))return toast('กรอกจำนวนที่ผลิต');
      const formula=o&&o.typeId===t.id?o.formula:(pl?pl.formula:t.formula);
      const inputs=o&&o.inputs?o.inputs:[];
      const inTanks=[...document.querySelectorAll('[data-intank]:checked')].map(e=>e.dataset.intank);
      const outTanks=[...document.querySelectorAll('[data-out]:checked')].map(e=>e.dataset.out);
      const doc={...(o||{}),...(pl?{planId:pl.id}:{}),no,typeId:t.id,typeName:t.name,code:t.code||'',formula,inputs,inTanks,outTanks,qty,startAt,due:$('#f-due').value,note:$('#f-note').value.trim(),status:o?o.status:'running',pauses:o?(o.pauses||[]):[],createdAt:o?o.createdAt:Date.now()};
      delete doc.id;
      const oid=o?o.id:uid(),ops=[['orders',oid,doc]];
      if(pl){const pd={...pl,status:'started',orderId:oid};delete pd.id;ops.push(['plans',pl.id,pd])}
      if(await putMany(ops)){closeModal();toast(o?'แก้ไขแล้ว':'เริ่มการผลิตแล้ว')}
    };
  });
}

/* ---------- input weights (admin only, free list) ---------- */
function wRow(r){r=r||{};return `<div class="line wr"><input list="dl-ing" data-wn placeholder="ชื่อข้าว" aria-label="ชื่อข้าว" value="${esc(r.name||'')}"><select data-wt aria-label="ถัง input"><option value="">ไม่ระบุถัง</option>${IN_TANKS.map(k=>`<option ${r.tank===k?'selected':''}>${k}</option>`).join('')}</select><input type="number" min="0" step="any" inputmode="decimal" data-wk placeholder="กก." aria-label="น้ำหนัก (กก.)" value="${r.kg?r.kg:''}"><button class="x" type="button" data-act="rm-line" aria-label="ลบแถว">×</button></div>`}
function weightFields(o){
  const rows=inputsOf(o).filter(r=>+r.kg>0);

/* ---------- pause / resume ---------- */
function pauseForm(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  openModal(`<div><h2>หยุดผลิตชั่วคราว</h2><div class="hint">${esc(o.no)} · ${esc(o.typeName)}</div></div>
  <div class="field"><label for="p-from">เวลาที่หยุด</label><input id="p-from" type="datetime-local" value="${nowLocal()}"></div>
  <div class="field"><label for="p-why">เหตุผลที่หยุด</label><input id="p-why" list="dl-why" placeholder="เลือกหรือพิมพ์เหตุผล"></div>
  <div class="foot"><button class="btn" data-act="close">ยกเลิก</button><button class="btn primary" id="p-save">บันทึกการหยุด</button></div>`,()=>{
    $('#p-save').onclick=async()=>{
      const from=$('#p-from').value,why=$('#p-why').value.trim();
      if(!from)return toast('ใส่เวลาที่หยุด');
      if(!why)return toast('ใส่เหตุผลที่หยุด');
      if(o.startAt&&new Date(from)<new Date(o.startAt))return toast('เวลาหยุดต้องไม่ก่อนเวลาเริ่มผลิต');
      if(await upd(o,{status:'paused',pauses:[...(o.pauses||[]),{from,reason:why}]})){closeModal();toast('บันทึกการหยุดผลิตแล้ว')}
    };
  });
}
function resumeForm(id){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  const ps=o.pauses||[],p=ps[ps.length-1];if(!p||p.to){upd(o,{status:'running'});return}
  openModal(`<div><h2>เริ่มผลิตต่อ</h2><div class="hint">หยุดตั้งแต่ ${dt(p.from)} · ${esc(p.reason)}</div></div>
  <div class="field"><label for="u-to">เวลาที่เริ่มผลิตต่อ</label><input id="u-to" type="datetime-local" value="${nowLocal()}"></div>
  <div class="hint" id="u-dur"></div>
  <div class="foot"><button class="btn" data-act="close">ยกเลิก</button><button class="btn primary" id="u-save">เริ่มผลิตต่อ</button></div>`,()=>{
    const d=()=>{const v=$('#u-to').value;$('#u-dur').textContent=v?'เวลาสูญเสียจากการหยุดครั้งนี้ '+lossStr(mins(p.from,v)):''};
    $('#u-to').oninput=d;d();
    $('#u-save').onclick=async()=>{
      const v=$('#u-to').value;
      if(!v)return toast('ใส่เวลาที่เริ่มผลิตต่อ');
      if(new Date(v)<new Date(p.from))return toast('เวลาต้องไม่ก่อนเวลาที่หยุด');
      const np=ps.map((x,i)=>i===ps.length-1?{...x,to:v}:x);
      if(await upd(o,{status:'running',pauses:np})){closeModal();toast('เริ่มผลิตต่อแล้ว')}
    };
  });
}

  <div class="jb" ${has?'':'hidden'}><label>จำนวนจัมโบ้ (ใบ)<input data-jn type="number" min="0" step="1" inputmode="numeric" value="${c.jumbo||''}"></label><label>เศษ (กก.)<input data-jr type="number" min="0" step="any" inputmode="decimal" value="${c.rem||''}"></label><div class="hint" data-jc></div></div></div>`;

function syncJumbo(){
  document.querySelectorAll('.bpr').forEach(r=>{
    const n=parseFloat(r.querySelector('[data-jn]').value)||0,m=parseFloat(r.querySelector('[data-jr]').value)||0,kg=r.querySelector('[data-bp]'),h=r.querySelector('[data-jc]');
    if(n>0||m>0){const nm=kg.dataset.bp,net=jumboNet(n,m,nm);kg.value=net;kg.readOnly=true;h.textContent=`(${jumboKg(nm)} × ${n}) + ${fmt(m)} − (${JUMBO_TARE} × ${jumboBags(n,m)} ใบ) = ${fmt(net)} กก.`}

}
function resultForm(id){

function readFormula(){return[...document.querySelectorAll('#t-lines .line')].map(r=>{const i=r.querySelectorAll('input');return{name:i[0].value.trim(),code:i[1].value.trim(),pct:Math.round((parseFloat(i[2].value)||0)*100)/100,raw:i[2].value}}).filter(r=>r.name||r.code||r.raw!=='').map(({name,code,pct})=>({name,code,pct}))}

/* ---------- dashboard ---------- */
function rangeOf(k,ref){
  const d=new Date(ref);d.setHours(0,0,0,0);const y=d.getFullYear(),m=d.getMonth(),n=d.getDate();
  if(k==='day')return[d,new Date(y,m,n+1)];
  if(k==='week'){const a=new Date(y,m,n-((d.getDay()+6)%7));return[a,new Date(a.getFullYear(),a.getMonth(),a.getDate()+7)]}
  if(k==='month')return[new Date(y,m,1),new Date(y,m+1,1)];
  return[new Date(y,0,1),new Date(y+1,0,1)];
}
function labelOf(k,a,b){
  if(k==='day')return a.toLocaleDateString('th-TH',{dateStyle:'full'});
  if(k==='week'){const e=new Date(b-1);return`${a.getDate()} ${MON[a.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]} ${e.getFullYear()+543}`}
  if(k==='month')return MONL[a.getMonth()]+' '+(a.getFullYear()+543);
  return'ปี '+(a.getFullYear()+543);
}
function shiftRef(k,ref,n){const d=new Date(ref);if(k==='day')d.setDate(d.getDate()+n);else if(k==='week')d.setDate(d.getDate()+7*n);else if(k==='month')d.setMonth(d.getMonth()+n,1);else d.setFullYear(d.getFullYear()+n,0,1);return d.getTime()}
function bucketsOf(k,a,b){
  const out=[];
  if(k==='week')for(let i=0;i<7;i++){const f=new Date(a.getFullYear(),a.getMonth(),a.getDate()+i);out.push({lb:DOW[f.getDay()]+' '+f.getDate(),f,t:new Date(f.getFullYear(),f.getMonth(),f.getDate()+1)})}
  else if(k==='month'){const n=Math.round((b-a)/864e5);for(let i=0;i<n;i++){const f=new Date(a.getFullYear(),a.getMonth(),i+1);out.push({lb:(i===0||(i+1)%5===0)?String(i+1):'',f,t:new Date(a.getFullYear(),a.getMonth(),i+2)})}}
  else if(k==='year')for(let i=0;i<12;i++)out.push({lb:MON[i],f:new Date(a.getFullYear(),i,1),t:new Date(a.getFullYear(),i+1,1)});
  return out;
}
function ymd(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}

    <div class="card tw"><table class="tbl"><thead><tr><th>ถัง input</th><th>ครั้ง</th><th>ตัน</th></tr></thead><tbody>${IN_TANKS.map(k=>`<tr><td>${k}</td><td>${IT[k].n||'-'}</td><td>${IT[k].kg?tn(IT[k].kg):'-'}</td></tr>`).join('')}</tbody></table></div></div>

  // order list
  const list=`<div class="dsec"><h2>รายการผลิตในช่วงนี้</h2><div class="card tw"><table class="tbl"><thead><tr><th>เลขที่ / ชนิดข้าว</th><th>สถานะ</th><th>เริ่ม</th><th>เสร็จ</th><th>เวลาผลิตจริง</th><th>input (ตัน)</th><th>ข้าวที่ได้ (ตัน)</th><th>ตัน/ชม.</th></tr></thead><tbody>
    ${M.map(({o,m})=>`<tr data-act="open" data-id="${o.id}"><td>${esc(o.no)} · ${esc(o.typeName)}</td><td><span class="pill ${st(o)}">${LABEL[st(o)]}</span></td><td>${dts(o.startAt)}</td><td>${m.done?dts(o.endAt):'-'}</td><td>${m.done?hm(m.net):'-'}</td><td>${m.hasIn?tn(m.inKg):'-'}</td><td>${m.outKg!=null?tn(m.outKg):'-'}</td><td>${m.rate!=null?fmt(m.rate):'-'}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  $('#dash-body').innerHTML=kpi+chart+typeTbl+`<div class="dgrid">${bpTbl}${lossTbl}</div>`+tankTbl+list;
}

/* ---------- production plans ---------- */
function planState(p){if(p.status!=='started')return'open';const o=S.orders.find(x=>x.id===p.orderId);return o?st(o):'running'}
function planQueue(){return S.plans.filter(p=>planState(p)==='open').sort((a,b)=>((a.seq==null?1e9:a.seq)-(b.seq==null?1e9:b.seq))||(a.plannedDate||'9').localeCompare(b.plannedDate||'9')||(a.createdAt||0)-(b.createdAt||0))}
function seqOps(list){const ops=[];list.forEach((p,i)=>{if(p.seq!==i+1){const d={...p,seq:i+1};delete d.id;ops.push(['plans',p.id,d])}});return ops}
async function movePlan(id,dir){
  const q=planQueue(),i=q.findIndex(x=>x.id===id),j=i+dir;
  if(i<0||j<0||j>=q.length)return;
  [q[i],q[j]]=[q[j],q[i]];
  await putMany(seqOps(q));
}
function planRow(p,qi,qn){

    <span class="pill ${s0}">${LABEL[s0]}</span>
    <span class="om"><b>${esc(p.typeName)} ${code?`<span class="code">${esc(code)}</span>`:''}</b><span class="no">${esc(p.no)}</span></span>
    <span class="ot">${fmt(p.qty)} กก. · ผลิต ${p.plannedDate?dd(p.plannedDate):'ไม่ระบุวัน'}</span>
    <span class="pa">${open&&isAdmin()?`<button class="btn sm" data-act="plan-up" data-id="${p.id}" aria-label="เลื่อนขึ้น" ${qi===1?'disabled':''}>▲</button><button class="btn sm" data-act="plan-down" data-id="${p.id}" aria-label="เลื่อนลง" ${qi===qn?'disabled':''}>▼</button>`:''}${open?`<button class="btn sm primary" data-act="start-plan" data-id="${p.id}">เริ่มการผลิต</button>`:'<span class="chev" aria-hidden="true">›</span>'}</span></div>`;

  await mk('006',a,25000,1,null,'ส่งลูกค้าประจำ');
  await mk('007',c,18000,2,null,'บรรจุถุง 5 กก.');
  toast('เพิ่มข้อมูลตัวอย่างแล้ว');
}

/* ---------- events ---------- */
function setTab(t){if(t==='recipes'&&!isAdmin())return;S.tab=t;try{history.replaceState(null,'','#'+t)}catch(e){location.hash=t}render()}
document.addEventListener('click',e=>{
  const ch=e.target.closest('.chip');if(ch){if(ch.dataset.pfilter)S.pf=ch.dataset.pfilter;else S.filter=ch.dataset.filter;render();return}
  if(e.target.id==='modal'){closeModal();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const id=b.dataset.id;
  const act=b.dataset.act;
  if(['edit-order','del-order','edit-type','del-type','reopen','del-pause','pw','weight','new-type','seed','new-plan','edit-plan','del-plan','plan-up','plan-down'].includes(act)&&!isAdmin()){toast('เฉพาะธุรการเท่านั้น');return}
  if(act==='record'){const o=S.orders.find(x=>x.id===id);if(o&&o.status==='done'&&!isAdmin()){toast('เฉพาะธุรการแก้ไขผลที่บันทึกแล้วได้');return}}
  switch(act){
    case 'jumbo':{const jb=b.closest('.bpr').querySelector('.jb');jb.hidden=!jb.hidden;if(!jb.hidden)jb.querySelector('input').focus();break}
    case 'open':orderDetail(id);break;
    case 'plan-open':planDetail(id);break;
    case 'plan-up':movePlan(id,-1);break;
    case 'plan-down':movePlan(id,1);break;
    case 'new-plan':planForm();break;
    case 'edit-plan':planForm(id);break;
    case 'del-plan':confirmDel('plan',id);break;
    case 'start-plan':startPlan(id);break;
    case 'pick-plan':case 'new-order':planPicker();break;
    case 'weight':weightForm(id);break;
    case 'dkind':S.dash.kind=b.dataset.k;renderDash();break;
    case 'dprev':S.dash.ref=shiftRef(S.dash.kind,S.dash.ref,-1);renderDash();break;
    case 'dnext':S.dash.ref=shiftRef(S.dash.kind,S.dash.ref,1);renderDash();break;
    case 'dtoday':S.dash.ref=Date.now();renderDash();break;
    case 'dclear':S.dash.type='';S.dash.status='all';S.dash.q='';$('#d-q').value='';renderDash();break;
    case 'add-w':$('#w-rows').insertAdjacentHTML('beforeend',wRow());break;
    case 'login-staff':setRole('staff');break;
    case 'login-admin':loginAdmin();break;
    case 'logout':closeModal();setRole(null);break;
    case 'pw':pwForm();break;
    case 'tab':setTab(b.dataset.tab);break;
    case 'new-order':orderForm();break;
    case 'edit-order':orderForm(id);break;
    case 'del-order':confirmDel('order',id);break;
    case 'record':resultForm(id);break;
    case 'pause':pauseForm(id);break;
    case 'resume':resumeForm(id);break;
    case 'del-pause':{const o=S.orders.find(x=>x.id===id),i=+b.dataset.i;const np=(o.pauses||[]).filter((_,k)=>k!==i);upd(o,{pauses:np,status:o.status==='paused'&&!np.some(p=>!p.to)?'running':o.status}).then(()=>setTimeout(()=>orderDetail(id),80));break}
    case 'reopen':{const o=S.orders.find(x=>x.id===id);upd(o,{status:'running'},['endAt','byproducts','resultNote','outputKg']).then(ok=>{if(ok){closeModal();toast('ย้อนกลับเป็นกำลังผลิตแล้ว')}});break}
    case 'new-type':typeForm();break;
    case 'edit-type':typeForm(id);break;
    case 'del-type':confirmDel('type',id);break;
    case 'seed':seed();break;
    case 'close':closeModal();break;
    case 'add-ing':$('#t-lines').insertAdjacentHTML('beforeend',fRow());break;
    case 'fill':fillRest();break;
    case 'rm-line':{const l=b.closest('.line');l.remove();if($('#t-lines'))meter();$('#sheet').dispatchEvent(new Event('input'));break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#q').addEventListener('input',e=>{S.q=e.target.value;renderOrders()});
$('#ptype').addEventListener('change',e=>{S.ptype=e.target.value;renderPlans()});
$('#pq').addEventListener('input',e=>{S.pq=e.target.value;renderPlans()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('div.orow[data-act]'))e.target.click()});
$('#ftype').addEventListener('change',e=>{S.typeFilter=e.target.value;renderOrders()});
$('#d-date').addEventListener('change',e=>{if(e.target.value){S.dash.ref=new Date(e.target.value+'T12:00').getTime();renderDash()}});
$('#d-type').addEventListener('change',e=>{S.dash.type=e.target.value;renderDash()});
$('#d-status').addEventListener('change',e=>{S.dash.status=e.target.value;renderDash()});
$('#d-q').addEventListener('input',e=>{S.dash.q=e.target.value;renderDash()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if((h==='plans'||h==='orders'||h==='recipes'||h==='dash')&&h!==S.tab){S.tab=h;render()}});
{const h=location.hash.slice(1);if(h==='plans'||h==='orders'||h==='recipes'||h==='dash')S.tab=h}
setInterval(()=>{if(S.role&&$('#modal').hidden){if(S.tab==='orders'){renderSummary();renderOrders()}else if(S.tab==='plans')renderPlans();else if(S.tab==='dash')renderDash()}},60000);
init();

/* ---------- ติดตั้งเป็นแอป ---------- */
(function(){
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
  const standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone;
  let dismissed=false;try{dismissed=localStorage.getItem('install-dismissed')==='1'}catch(e){}
  if(standalone||dismissed)return;
  let ev=null;
  function bar(text,btn){
    if(document.getElementById('installbar'))return;
    const d=document.createElement('div');d.id='installbar';
    d.innerHTML='<span></span>'+(btn?'<button class="btn primary" type="button">'+btn+'</button>':'')+'<button class="btn" type="button" aria-label="ปิด">ปิด</button>';
    d.querySelector('span').textContent=text;
    const bs=d.querySelectorAll('button');
    if(btn)bs[0].onclick=async()=>{if(ev){ev.prompt();try{await ev.userChoice}catch(e){}ev=null}d.remove()};
    bs[bs.length-1].onclick=()=>{d.remove();try{localStorage.setItem('install-dismissed','1')}catch(e){}};
    document.body.appendChild(d);
  }
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;bar('ติดตั้งเป็นแอปบนเครื่อง เปิดใช้ได้เหมือนแอปทั่วไป','ติดตั้ง')});
  const ua=navigator.userAgent;
  if(/iphone|ipad|ipod/i.test(ua)&&!/crios|fxios/i.test(ua)){
    setTimeout(()=>bar('ติดตั้งแอป: แตะปุ่มแชร์ (สี่เหลี่ยมมีลูกศรขึ้น) แล้วเลือก "เพิ่มไปยังหน้าจอโฮม"'),2500);
  }
})();
</script>
